<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<link rel="stylesheet" href="css/base.css?v=3">
<link rel="stylesheet" href="css/acceso.css?v=3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <script>document.documentElement.setAttribute('data-tema', localStorage.getItem('tema') || 'claro');</script>
  
  
  
</head>
<body>

  <button type="button" class="btn-tema" id="btnTema" title="Cambiar tema">🌙</button>

  <main class="register-card">
    <h2>Crear una cuenta</h2>
    <p>Ingresa tus datos para registrarte</p>

    <form id="register-form" action="#" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"
                 autocomplete="given-name" required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Tu apellido"
                 autocomplete="family-name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com"
               autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••"
               autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>

      <p class="mensaje" id="mensaje"></p>

      <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </form>
  </main>

  <script src="js/registro.js?v=3"></script>
  <script src="js/tema.js?v=2"></script>

</body>
</html>
