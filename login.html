<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<link rel="stylesheet" href="css/base.css?v=3">
<link rel="stylesheet" href="css/acceso.css?v=5">
  <link rel="icon" type="image/png" href="img/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <script>document.documentElement.setAttribute('data-tema', localStorage.getItem('tema') || 'claro');</script>
  
  
  
</head>
<body>

  <button type="button" class="btn-tema" id="btnTema" title="Cambiar tema">🌙</button>

  <main class="login-card">
    <div class="marca login-marca">
      <img src="img/logo.png" alt="" width="80" height="80">
      <span>NIVELSABER</span>
    </div>
    <h2>Iniciar Sesión</h2>
    <p>Ingresa tus datos para continuar</p>
    <form id="login-form" action="#" method="POST">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com"
               autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-toggle-password="password"
                  aria-label="Mostrar contraseña" aria-pressed="false">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>

      <p class="mensaje" id="mensaje"></p>

      <div class="login-link">
        ¿No tienes cuenta? <a href="crearCuenta.html">Regístrate</a>
      </div>
    </form>
  </main>

  <script src="js/registro.js?v=3"></script>
  <script src="js/tema.js?v=2"></script>

</body>
</html>
