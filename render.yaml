services:
  - type: web
    name: nivelsaber-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend --config backend/gunicorn.conf.py app:app
    healthCheckPath: /api/salud
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: NIVELSABER_CLAVE_SECRETA
        generateValue: true
